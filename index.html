<style>
  :root{
    --bg:#22251E; --panel:#2B2F27; --panel-2:#343930; --line:#414639;
    --ink:#EAE6D8; --ink-2:#B7B3A3; --ink-3:#7E7C6E;
    --strap:#E0842A; --strap-2:#F2A552; --sage:#98AF72; --steel:#7FA6B8; --dust:#C9B98A;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Bahnschrift","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.35;overflow:hidden;
       font-variation-settings:"wdth" 90}
  ::selection{background:var(--strap);color:#1b1a15}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer;background:none;border:0;padding:0}
  :focus-visible{outline:2px solid var(--strap-2);outline-offset:2px}

  .app{display:grid;grid-template-columns:420px 1fr;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/-1;display:flex;align-items:baseline;gap:18px;padding:14px 22px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.01em;font-variation-settings:"wdth" 75}
  header h1 small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:10px}
  .org{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--ink-2)}
  .org label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;position:relative}
  .switch{width:40px;height:22px;border-radius:11px;background:var(--line);position:relative;transition:background .15s}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--ink-2);transition:transform .15s,background .15s}
  input:checked + .switch{background:var(--steel)}
  input:checked + .switch::after{transform:translateX(18px);background:#fff}
  .org input{position:absolute;opacity:0;width:0;height:0}

  aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
  .tools{padding:12px 14px 10px;display:grid;gap:8px;border-bottom:1px solid var(--line);min-width:0}
  .tools>*{min-width:0}
  .search{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 10px;height:36px}
  .search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:0 8px;font-size:15px}
  .search input::placeholder{color:var(--ink-3)}
  .search kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .row{display:flex;gap:8px}
  select{flex:1;min-width:0;width:50%;background:var(--bg);border:1px solid var(--line);border-radius:6px;height:32px;padding:0 8px;color:var(--ink-2)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--ink-2);font-size:13px}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .count{color:var(--ink-3);font-size:12px;padding:6px 16px 4px}

  .list{overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);color:var(--ink)}
  .item:hover{background:var(--panel-2)}
  .item[aria-current="true"]{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--strap)}
  .item .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .m{color:var(--ink-3);font-size:12px}
  .item .cap{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
  .item .cap b{color:var(--strap-2);font-weight:600}
  .item .pr{color:var(--ink-2);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
  .item .pr.none{color:var(--ink-3)}
  .empty{padding:40px 20px;color:var(--ink-3);text-align:center}

  main{overflow:auto;padding:26px 34px 40px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .title h2{margin:0;font-size:34px;font-weight:700;letter-spacing:-.01em;font-variation-settings:"wdth" 75;line-height:1.05}
  .tag{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
  .sub{color:var(--ink-3);margin:6px 0 22px}
  .sub code{font-family:Consolas,monospace;color:var(--ink-2)}

  .bigs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:22px}
  .big{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .big .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;font-variation-settings:"wdth" 80}
  .big .l{color:var(--ink-3);font-size:12px;margin-top:5px}
  .big.max .v{color:var(--strap-2)}
  .big.price .v{font-size:24px;padding-top:4px}

  .gauge{margin:6px 0 26px}
  .bar{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
  .seg{display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#1b1a15;min-width:0;overflow:hidden;white-space:nowrap;transition:flex-basis .25s}
  .seg.fixed{background:var(--dust)} .seg.glove{background:#a99c73} .seg.seats{background:var(--sage)}
  .seg.rack{background:var(--strap)} .seg.other{background:var(--strap-2)}
  .seg.rack,.seg.other{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.12) 6px 8px)}

<script id="changelog" type="application/json">[{"v": "7.5", "label": "Sep 29", "items": ["New Upgrade Tool (button at the top, or Open in Upgrade Tool on any vehicle): pick a vehicle and the armor, bullbars, roof racks and other add-ons you want, see them fitted on the car, and get the total materials, tools and skills needed to craft and fit them", "Much faster loading, especially on phones: pictures now load as you scroll instead of all at once"]}, {"v": "7.4", "label": "Sep 29", "items": ["Pictures now show each vehicle stock, the way it looks when you buy it", "New Stock / Fully kitted switch next to the search bar (and on each vehicle's picture): Fully kitted shows the vehicle with every armor plate, bullbar, roof rack and add-on fitted, like the in-game shop. Idea by 2klogic"]}, {"v": "7.3", "label": "Sep 29", "items": ["New look: the tool now opens as a catalog laid out like the in-game shop, with a picture, class and price for every vehicle. Click a vehicle to open its stats", "Every vehicle now has a picture, also shown in Compare", "Vehicles are sorted cheapest first by default, with tabs for Standard, Heavy-Duty and Sports", "The previous list layout is one click away with the List view button"]}, {"v": "7.2", "label": "Sep 28", "items": ["New sort option: relics. The 17 vehicles that cost relics come first, cheapest relic price first (ties by scrap price), then everything else by name"]}, {"v": "7", "label": null, "items": ["New: Compare mode. Add 2 to 4 vehicles with the Compare button (or press C) and see storage, performance and price side by side, with the best value in each row highlighted", "Changed prices for 67 vehicles, and the '70 Chevelle Wagon SS Nomad is now for sale ($200,000)", "Added Relics as a second price: 17 vehicles cost relics, and 5 of them cost relics only (SWAT Van, Challenger Black Ghost, 911 RWB, Big Chief, Ultimate Big Chief)", "Seat storage corrected where front and rear seats hold different amounts: Minis +4, W460 4-door LWB and Military +10, K5, M1009 and Suburban −10", "Seat count corrected: '92 Wrangler YJ 2 → 4 seats (+50), F-150 and F-250 Single Cab 4 → 2 seats (−50), and all 51 Econoline liveries 0 → 6 seats (+120)"]}, {"v": "6", "label": null, "items": ["Added 4 new mods: '69 Mini Mk2 (5 variants), '84 Jeep Cherokee XJ (5), '84 Mercedes-Benz W460 (4), '70 Chevrolet Chevelle / El Camino (9) — 23 new vehicles", "Total vehicle count: 181 → 204", "Full storage, performance and price data for all 23 new vehicles", "Corrected vehicle type labels for the new SUVs, pickups and coupes"]}, {"v": "5", "label": null, "items": ["Synced shop prices against a full catalog export", "'73 Skyline GT-R corrected: $45,000 → $40,000", "'79 Camaro Cloud priced for the first time: $375,000"]}, {"v": "4", "label": null, "items": ["Added Performance section: horsepower, engine force, max speed, braking force, engine loudness, wheel friction, roll influence, suspension stiffness / damping / compression, steering lock", "Added sort options: most powerful, fastest, quietest, lightest"]}, {"v": "3", "label": null, "items": ["Added shop Price, sourced from in-game screenshots", "Added scraps-per-storage-unit as a value metric"]}, {"v": "2", "label": null, "items": ["Added the Organized trait toggle (×1.3 capacity, truncated the way the game does it)", "Validated against a live '69 Mustang Boss 302: trunk, seats and glovebox all matched in-game exactly"]}, {"v": "1", "label": "Sep 12", "items": ["Initial release: 181 vehicles across 28 vehicle mods, parsed directly from the mod script files", "Storage breakdown: stock (trunk/bed + glovebox + seats) vs. optional add-ons (roof racks, side storage, etc.)"]}]</script>

const IMG = new Proxy({}, { get: (t, id) => PICS.has(id) ? 'pictures/stock/' + encodeURIComponent(id) + '.webp' : undefined });
const KIT = 'pictures/kitted/', kitFail = new Set();
const picSrc = (v, th) => { const id = encodeURIComponent(v.id); return state.kit && !kitFail.has(v.id) ? (th ? 'pictures/kitted-thumb/' : KIT) + id + '.webp' : th ? 'pictures/thumb/' + id + '.webp' : IMG[v.id]; };
const pic = (v, cls='', th=false) => IMG[v.id] ? `<img class="${cls}" src="${picSrc(v, th)}" data-pic="${v.id}"${th ? ' data-th="1" width="400" height="240"' : ' width="800" height="480"'} alt="${v.name.replace(/"/g,'&quot;')}${state.kit ? ', fully kitted' : ''}" loading="lazy" decoding="async">` : '';
document.addEventListener('error', e => { const im = e.target; if (im.tagName === 'IMG' && im.dataset.pic && IMG[im.dataset.pic] && !im.dataset.fb) { im.dataset.fb = 1; kitFail.add(im.dataset.pic); im.src = IMG[im.dataset.pic]; } }, true);
const fmt = n => n.toLocaleString('en-US');
const state = { q:'', sort:'name', type:'', cls:'', org:false, sel:null, cmp:[], view:'shop', from:null, onlyShop:true, kit:false };
state.sort='price';
try { const c = JSON.parse(localStorage.getItem('atf-compare') || '[]'); if (Array.isArray(c)) state.cmp = c.filter(id => DATA.some(v => v.id === id)).slice(0, 4); } catch (e) {}
const inShop = v => v.price != null || v.relics > 0;
const priceText = v => v.price != null ? '$' + fmt(v.price) + (v.relics ? ` + ${v.relics} relics` : '') : v.relics ? `${v.relics} relics` : 'not in shop';

const human = p => {
  let s = p.replace(/^[A-Z0-9]{2,}(?=[A-Z][a-z])/, '').replace(/^DAMN/, '');
  s = s.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
  return s.replace(/\s?(AP|A P)$/, '').trim() || p;
};
const seatText = v => v.seatDetail
  .replace(/(\d+) per seat x (\d+) seats/, (m,a,b) => `${mult(+a)} per seat × ${b} seats`)
  .replace(/Seat(Front|Rear|Middle)(Left|Right) (\d+)/g, (m,a,b,c) => `${a.toLowerCase()} ${b.toLowerCase()} ${mult(+c)}`)
  .replace(/Seat([A-Z]\w*) (\d+)/g, (m,a,c) => `${a.toLowerCase()} ${mult(+c)}`);
const mult = v => state.org ? Math.floor(v * 1.3) : v;
const stock = v => v.fixed + v.glove + v.seatCap;
const addon = v => v.rack + v.other;
const maxT = v => stock(v) + addon(v);
const value = v => v.price ? v.price / maxT(v) : Infinity;
const PK = ["engineForce","maxSpeed","brakingForce","engineLoudness","mass","wheelFriction","rollInfluence","suspensionStiffness","suspensionDamping","suspensionCompression","steeringClamp","engineQuality"];
const RANGE = Object.fromEntries(PK.map(k => { const a = DATA.map(v => v.perf[k]).filter(x => typeof x === 'number'); return [k, [Math.min(...a), Math.max(...a)]]; }));
const pct = (k, x) => { const [lo, hi] = RANGE[k]; return hi > lo ? Math.max(3, (x - lo) / (hi - lo) * 100) : 100; };
const stat = (k, label, hint, unit, color, cls='') => { const x = DATA.find(v => v.id === state.sel).perf[k]; if (x == null) return '';
  return `<div class="stat ${cls}"><span class="k">${label}${hint ? `<i>${hint}</i>` : ''}</span><span class="t" style="--w:${pct(k, x).toFixed(1)}%;${color ? '--c:' + color : ''}"></span><span class="v">${typeof x === 'number' ? fmt(x) : x}${unit ? `<i>${unit}</i>` : ''}</span></div>`; };
function perfHTML(v){

      ${stat('engineForce','Engine force','raw script value','','var(--strap-2)')}
      ${stat('maxSpeed','Max speed','','','var(--sage)')}
      ${stat('brakingForce','Braking force','','','var(--steel)')}
      ${stat('engineLoudness','Engine loudness','lower is stealthier','','#b8846a')}
      ${stat('mass','Mass','kg-ish, affects towing & ramming','','var(--dust)')}
      ${stat('wheelFriction','Wheel friction','grip','','var(--sage)')}
      ${stat('rollInfluence','Roll influence','lower = less body roll','','var(--steel)')}
      ${stat('suspensionStiffness','Suspension stiffness','','','var(--dust)')}
      ${stat('suspensionDamping','Suspension damping','','','var(--dust)')}
      ${stat('suspensionCompression','Suspension compression','','','var(--dust)')}
      ${stat('steeringClamp','Steering lock','','','var(--dust)')}
    </div></div>`;
}

[...new Set(DATA.map(v => v.type))].sort().forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; $('#type').append(o); });

function filtered(){
  const q = state.q.trim().toLowerCase();
  let r = DATA.filter(v =>
    (!q || q.split(/\s+/).every(w => (v.name + ' ' + v.mod + ' ' + v.type + ' ' + v.cls + ' ' + v.id).toLowerCase().includes(w))) &&
    (!state.type || v.type === state.type) && (!state.onlyShop || listMode() || inShop(v)) &&
    (state.cls === '' || (state.cls === 'sold' ? inShop(v) : v.cls === state.cls)));
  const s = state.sort;
  r.sort((a,b) =>
    s==='max' ? maxT(b)-maxT(a) : s==='stock' ? stock(b)-stock(a) : s==='rack' ? b.rack-a.rack :
    s==='relics' ? ((!!b.relics - !!a.relics) || (a.relics - b.relics) || ((a.price ?? 0) - (b.price ?? 0)) || a.name.localeCompare(b.name)) :
    s==='price' ? (((a.price ?? (a.relics ? 1e9 : 1e12)) + a.relics*1e6) - ((b.price ?? (b.relics ? 1e9 : 1e12)) + b.relics*1e6)) : s==='value' ? value(a)-value(b) :
    s==='hp' ? b.perf.engineForce-a.perf.engineForce : s==='speed' ? b.perf.maxSpeed-a.perf.maxSpeed :
    s==='quiet' ? a.perf.engineLoudness-b.perf.engineLoudness : s==='light' ? a.perf.mass-b.perf.mass :
    a.name.localeCompare(b.name));
  return r;
}

document.addEventListener('click', e => { const b = e.target.closest('.kit button'); if (b) { e.stopPropagation(); setKit(b.dataset.kit === '1'); } }, true);
function openShop(){ state.view = 'shop'; updateCmpBtn(); renderShop(); $('#detail').scrollTop = state.shopScroll || 0; }
function renderDetail(){

  const rowsOf = list => list.map(d => `<tr><td>${human(d.part)}${d.item && d.item.replace(/\s*\(\d+\)$/,'').toLowerCase() !== human(d.part).toLowerCase() ? `<span class="it">${d.item.replace(/\s*\(\d+\)$/,'')}</span>` : ''}${d.note ? `<span class="nt">${d.note}</span>` : ''}</td><td>${/^\d+$/.test(d.cap) ? fmt(mult(+d.cap)) : d.cap}</td></tr>`).join('');

    <div class="title"><h2>${v.name}</h2><span class="tag">${v.cls}</span><span class="tag">${v.type}</span><span class="tag">${v.seats} seat${v.seats===1?'':'s'}</span>${(() => { const on = state.cmp.includes(v.id), full = !on && state.cmp.length >= 4;
      return `<button class="cmp-toggle" id="cmpToggle" aria-pressed="${on}" ${full ? 'disabled' : ''} title="${full ? 'Compare is full (4 of 4). Remove one to add this vehicle.' : 'Shortcut: C'}">${on ? '✓ In compare' : full ? 'Compare full (4/4)' : '+ Compare'}</button>`; })()}</div>

const UPG = (() => { try { return JSON.parse(document.getElementById('upg').textContent); } catch (e) { return {items:{}, installs:[], vehicles:{}}; } })();
const upgSel = {};  // vehicle id -> {slotIndex: itemId}
const SKILL = {MetalWelding:'Welding', Mechanics:'Mechanics', Woodwork:'Carpentry', Tailoring:'Tailoring', Electricity:'Electrical'};
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function upgHTML(v){
  const slots = UPG.vehicles[v.id];
  if (!slots || !slots.length) return '';
  const sel = upgSel[v.id] || (upgSel[v.id] = {});
  const rows = slots.map(([part, opts], i) => `<div class="uslot"><div class="sl">${esc(human(part))}</div><div class="uopts">${opts.map(it => {
      const o = UPG.items[it];
      return `<button type="button" class="uo" data-us="${i}" data-ui="${it}" aria-pressed="${sel[i] === it}">${esc(o.name)}${o.recipe ? '' : '<span class="nr">no recipe</span>'}</button>`; }).join('')}</div></div>`).join('');
  return `<section class="upg" id="upg" data-vid="${v.id}"><h3>Upgrades <span class="hint">pick what you want to build, the totals add up as you pick</span><span class="sp"></span><button type="button" class="ub" data-uall="1">Select all</button><button type="button" class="ub" data-uall="0">Clear</button></h3>
    <div class="ugrid"><div>${rows}</div><div class="utot" id="utot">${upgTotals(v)}</div></div></section>`;
}
function upgTotals(v){
  const slots = UPG.vehicles[v.id] || [], sel = upgSel[v.id] || {};
  const mats = new Map(), tools = new Set(), craft = {}, fit = {}, mags = new Set(), nores = [];
  let n = 0;
  for (const [i, it] of Object.entries(sel)) {
    const slot = slots[i]; if (!slot) continue; n++;
    const o = UPG.items[it], ins = UPG.installs[slot[2]] || {};
    for (const [k, l] of Object.entries(ins.skills || {})) fit[k] = Math.max(fit[k] || 0, l);
    (ins.tools || []).forEach(t => tools.add(t));
    if (ins.recipes) mags.add(ins.recipes);
    if (!o.recipe) { nores.push(o.name); continue; }
    for (const [names, c, uses] of o.recipe.in) { const key = names.join(' or '); const m = mats.get(key) || {c:0, uses}; m.c += c; mats.set(key, m); }
    o.recipe.tools.forEach(t => tools.add(t));
    for (const [k, l] of Object.entries(o.recipe.skills)) craft[k] = Math.max(craft[k] || 0, l);
  }
  if (!n) return upgPreview(v) + '<h4>Materials</h4><div class="empty">Pick one or more upgrades on the left to see what you need.</div>';
  const li = (a, b) => `<li><span>${esc(a)}</span><b>${b}</b></li>`;
  const sk = o => Object.entries(o).map(([k, l]) => li(SKILL[k] || k, l)).join('');
  const matList = [...mats].sort((a, b) => b[1].c - a[1].c).map(([k, m]) => li(k, m.uses ? m.c + ' uses' : '×' + m.c)).join('');
  return upgPreview(v) + `<h4>Materials for ${n} upgrade${n === 1 ? '' : 's'}</h4>${matList ? `<ul>${matList}</ul>` : '<div class="empty">Nothing to craft.</div>'}
    ${nores.length ? `<h4>No crafting recipe (find or buy these)</h4><ul>${[...new Set(nores)].map(x => li(x, '×' + nores.filter(y => y === x).length)).join('')}</ul>` : ''}
    ${tools.size ? `<h4>Tools</h4><ul>${[...tools].map(t => li(t, '')).join('')}</ul>` : ''}
    ${Object.keys(craft).length ? `<h4>Skill to craft</h4><ul>${sk(craft)}</ul>` : ''}
    ${Object.keys(fit).length || mags.size ? `<h4>Skill to install</h4><ul>${sk(fit)}${[...mags].map(m => li(m, 'recipe')).join('')}</ul>` : ''}
    <p class="note">From the mods' crafting and install scripts. Uses = charges of a drainable item.</p>`;
}

const ULAY = (() => { try { return JSON.parse(document.getElementById('ulayers').textContent); } catch (e) { return {}; } })();
const layerImgs = v => { const sel = upgSel[v.id] || {}, L = ULAY[v.id] || {};
  return Object.entries(sel).map(([i, it]) => (L[i] || {})[it]).filter(Boolean)
    .map(h => `<img src="pictures/upg/${h}.webp" alt="" onerror="this.remove()">`).join(''); };
function upgPreview(v){ return IMG[v.id] ? `<div class="uprev"><img src="${IMG[v.id]}" alt="${esc(v.name)} with the picked upgrades"><div class="ulay">${layerImgs(v)}</div></div>` : ''; }
function refreshLayers(v, picked){
  if (picked && state.kit && Object.keys(upgSel[v.id] || {}).length) setKit(false);
  const hero = v.id === state.sel ? document.querySelector('#detail .hero .pic') : null;
  if (hero) { let l = hero.querySelector('.ulay'); if (!l) { l = document.createElement('div'); l.className = 'ulay'; hero.insertBefore(l, hero.querySelector('.kit')); } l.innerHTML = state.kit ? '' : layerImgs(v); }
  const pv = document.querySelector('#utot .uprev .ulay'); if (pv) pv.innerHTML = layerImgs(v);
}

function upgLink(v){

    <p>Pick upgrades, see them on the car and get the materials, tools and skills you need.</p></section>`;
}
const UT_LIST = DATA.filter(v => UPG.vehicles[v.id]).sort((a, b) => a.name.localeCompare(b.name));

function openUT(id){

  if ($('#dm').classList.contains('open')) closeDm();
  renderUT(); $('#um').classList.add('open'); $('#um').scrollTop = 0;
}
const closeUT = () => { $('#um').classList.remove('open'); if (state.sel && ($('#dm').classList.contains('open') || listMode())) renderDetail(); };
function upgClick(e){
  const b = e.target.closest('.uo, .ub'); if (!b || !b.closest('#upg')) return false;
  const v = DATA.find(x => x.id === (b.closest('#upg').dataset.vid || state.sel)); if (!v) return true;
  const sel = upgSel[v.id] || (upgSel[v.id] = {});
  if (b.dataset.uall === '1') (UPG.vehicles[v.id] || []).forEach(([p, opts], i) => { const r = opts.filter(it => UPG.items[it].recipe); sel[i] = (r.length ? r : opts)[ (r.length ? r : opts).length - 1]; });
  else if (b.dataset.uall === '0') { for (const k in sel) delete sel[k]; }
  else { const i = b.dataset.us; if (sel[i] === b.dataset.ui) delete sel[i]; else sel[i] = b.dataset.ui; }
  document.querySelectorAll('#upg .uo').forEach(x => x.setAttribute('aria-pressed', sel[x.dataset.us] === x.dataset.ui));
  $('#utot').innerHTML = upgTotals(v);
  refreshLayers(v, true);
  return true;
}
function saveCmp(){ try { localStorage.setItem('atf-compare', JSON.stringify(state.cmp)); } catch (e) {} }
function updateCmpBtn(){
  const n = state.cmp.length, b = $('#cmpBtn');
  $('#cmpN').textContent = n; b.disabled = n < 2; b.classList.toggle('on', state.view === 'compare');
  $('#shopBtn').classList.toggle('on', state.view === 'shop');
  b.title = n < 2 ? 'Add at least 2 vehicles with the Compare button' : 'Compare ' + n + ' vehicles';
}
function toggleCmp(id){
  const i = state.cmp.indexOf(id);
  if (i >= 0) state.cmp.splice(i, 1);
  else if (state.cmp.length >= 4) return;
  else state.cmp.push(id);
  if (state.view === 'compare' && state.cmp.length < 2) { closeDm(); }
  saveCmp(); updateCmpBtn(); renderList(); renderDetail();
}
function openCompare(){ if (state.cmp.length < 2) return; state.view = 'compare'; updateCmpBtn(); renderDetail(); openDm(); }
const listMode = () => document.body.classList.contains('listmode');
function openDm(){ if (listMode()) { $('#listMain').scrollTop = 0; document.querySelector(`.item[data-id="${state.sel}"]`)?.scrollIntoView({block:'nearest'}); return; } $('#dm').classList.add('open'); $('#dm').scrollTop = 0; }
function closeDm(){ if (listMode()) { state.view = 'detail'; updateCmpBtn(); renderDetail(); return; } $('#dm').classList.remove('open'); state.view = 'shop'; updateCmpBtn(); renderShop(); }
const CMP_ROWS = [
  ['Shop'],
  ['Class', v => v.cls, null, 'text'],
  ['Type', v => v.type, null, 'text'],
  ['Price (scraps)', v => v.price, 'low', v => v.price != null ? '$' + fmt(v.price) : '—'],
  ['Price (relics)', v => v.relics || null, 'low', v => v.relics ? fmt(v.relics) : '—'],
  ['Scraps per unit at max', v => v.price != null ? Math.round(v.price / mult(maxT(v))) : null, 'low'],
  ['Storage'],
  ['Stock total', v => mult(stock(v)), 'high'],
  ['Add-ons, all fitted', v => mult(addon(v)), 'high', v => addon(v) ? '+' + fmt(mult(addon(v))) : '—'],
  ['Maximum', v => mult(maxT(v)), 'high'],
  ['Trunk / bed', v => mult(v.fixed), 'high'],
  ['Glovebox', v => mult(v.glove), 'high'],
  ['Seats', v => mult(v.seatCap), 'high', v => `${fmt(mult(v.seatCap))} <span class="dim">(${v.seats})</span>`],
  ['Rack slot', v => mult(v.rack), 'high'],
  ['Other add-ons', v => mult(v.other), 'high'],
  ['Performance'],
  ['Horsepower', v => Math.round(v.perf.engineForce / 10), 'high'],
  ['Max speed', v => v.perf.maxSpeed, 'high'],
  ['Braking force', v => v.perf.brakingForce, 'high'],
  ['Engine loudness', v => v.perf.engineLoudness, 'low'],
  ['Mass', v => v.perf.mass, null],
  ['Wheel friction', v => v.perf.wheelFriction, 'high'],
  ['Roll influence', v => v.perf.rollInfluence, 'low'],
  ['Suspension stiffness', v => v.perf.suspensionStiffness, null],
  ['Suspension damping', v => v.perf.suspensionDamping, null],
  ['Suspension compression', v => v.perf.suspensionCompression, null],
  ['Steering lock', v => v.perf.steeringClamp, null],
  ['Base engine quality', v => v.perf.engineQuality, 'high'],
  ['Engine repair (Mechanics)', v => v.perf.engineRepairLevel, 'low'],
];
function renderCompare(){
  const vs = state.cmp.map(id => DATA.find(v => v.id === id)).filter(Boolean);
  const head = `<tr><th></th>${vs.map(v => `<th>${pic(v, 'th-img')}${v.name}<span class="cm">${v.mod}</span><button data-rm="${v.id}">remove</button></th>`).join('')}</tr>`;
  const body = CMP_ROWS.map(([label, get, dir, show]) => {
    if (!get) return `<tr class="grp"><td colspan="${vs.length + 1}">${label}</td></tr>`;
    const vals = vs.map(get);
    const nums = vals.filter(x => typeof x === 'number');
    let best = null;
    if (dir && nums.length > 1 && new Set(nums).size > 1) best = dir === 'high' ? Math.max(...nums) : Math.min(...nums);
    return `<tr><td>${label}</td>${vs.map((v, i) => {
      const x = vals[i];
      const txt = typeof show === 'function' ? show(v) : x == null ? '—' : typeof x === 'number' ? fmt(x) : x;
      return `<td class="${best != null && x === best ? 'best' : ''}">${txt}</td>`;
    }).join('')}</tr>`;
  }).join('');
  $('#detail').innerHTML = `
    <div class="cmp-head"><h2>Compare</h2><p>${vs.length} vehicles${state.org ? ' · Organized applied' : ''}</p><button class="cmp-toggle cmp-clear" id="cmpClear">Clear all</button></div>
    <div class="cmp-wrap"><table class="cmp"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="cmp-note">▲ marks the best value in each row: more storage, power, speed, braking and grip is better; lower price, loudness, body roll and repair level is better. Mass and suspension are not ranked. Pick a vehicle on the left to go back to its detail page.</div>`;
}
$('#detail').addEventListener('click', e => {
  const ou = e.target.closest('[data-openut]'); if (ou) return openUT(ou.dataset.openut);
  if (upgClick(e)) return;
  if (e.target.closest('#cmpToggle')) return toggleCmp(state.sel);
  const rm = e.target.closest('[data-rm]'); if (rm) return toggleCmp(rm.dataset.rm);
  if (e.target.closest('#cmpClear')) { state.cmp = []; saveCmp(); closeDm(); renderList(); }
});
$('#cmpBtn').addEventListener('click', () => state.view === 'compare' ? closeDm() : openCompare());
let qT; $('#q').addEventListener('input', e => { state.q = e.target.value; clearTimeout(qT); qT = setTimeout(renderList, 120); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderList(); });
$('#type').addEventListener('change', e => { state.type = e.target.value; renderList(); });
$('#cls').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  state.cls = b.dataset.v;
  document.querySelectorAll('#cls .chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  renderList();
});
$('#org').addEventListener('change', e => { state.org = e.target.checked; renderList(); renderDetail(); });
$('#list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) { select(b.dataset.id, false); updateCmpBtn(); } });
document.addEventListener('keydown', e => {
  if (!listMode() && !$('#dm').classList.contains('open') && ['ArrowDown','ArrowUp','c','C'].includes(e.key)) return;
  if ((e.key === 'c' || e.key === 'C') && !['INPUT','SELECT'].includes(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey && state.sel) { toggleCmp(state.sel); return; }
  if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  if (e.key === 'Escape') { $('#q').value = ''; state.q = ''; renderList(); }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && document.activeElement.tagName !== 'SELECT') {
    const r = filtered(); const i = r.findIndex(v => v.id === state.sel);
    const n = r[Math.min(Math.max(i + (e.key === 'ArrowDown' ? 1 : -1), 0), r.length - 1)];
    if (n) { e.preventDefault(); select(n.id); }
  }
});
const CHANGELOG = JSON.parse(document.getElementById('changelog').textContent);
$('#clBody').innerHTML = CHANGELOG.map(e => `
  <div class="cl-entry">
    <div class="cl-head"><span class="cl-v">v${e.v}</span>${e.label ? `<span class="cl-label">${e.label}</span>` : ''}</div>
    <ul>${e.items.map(i => `<li>${i}</li>`).join('')}</ul>
  </div>`).join('');
const clBackdrop = $('#clBackdrop');
const openCl = () => clBackdrop.classList.add('open');
const closeCl = () => clBackdrop.classList.remove('open');
$('#changelogBtn').addEventListener('click', openCl);
$('#clClose').addEventListener('click', closeCl);
clBackdrop.addEventListener('click', e => { if (e.target === clBackdrop) closeCl(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && clBackdrop.classList.contains('open')) closeCl(); });

$('#grid').addEventListener('click', e => { const c = e.target.closest('[data-card]'); if (c) select(c.dataset.card); });
$('#dclose').addEventListener('click', closeDm);
$('#utBtn').addEventListener('click', () => openUT());
$('#uclose').addEventListener('click', closeUT);
$('#um').addEventListener('click', e => { if (e.target === $('#um')) closeUT(); });
$('#utool').addEventListener('click', upgClick);
$('#utool').addEventListener('change', e => { if (e.target.id === 'utVeh') { utVid = e.target.value; renderUT(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#um').classList.contains('open') && !clBackdrop.classList.contains('open')) closeUT(); });
$('#dm').addEventListener('click', e => { if (e.target === $('#dm')) closeDm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#dm').classList.contains('open') && !clBackdrop.classList.contains('open')) closeDm(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { state.cls = t.dataset.tab; document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-pressed', x === t)); renderList(); }));
let sqT; $('#sq').addEventListener('input', e => { state.q = e.target.value; $('#q').value = state.q; clearTimeout(sqT); sqT = setTimeout(renderList, 120); });
$('#ssort').value = 'price'; $('#sort').value = 'price';
function syncControls(){
  $('#q').value = state.q; $('#sq').value = state.q; $('#sort').value = state.sort; $('#ssort').value = state.sort;
  document.querySelectorAll('#cls .chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.v === state.cls));
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-pressed', t.dataset.tab === state.cls));
}
function setListMode(on){
  document.body.classList.toggle('listmode', on);
  $('#dm').classList.remove('open');
  (on ? $('#listMain') : $('#dm .dpanel')).appendChild($('#detail'));
  $('#viewBtn').textContent = on ? 'Catalog view' : 'List view';
  if (state.cls === 'sold' && !on) state.cls = '';
  syncControls();
  if (on) { const r = filtered(); if (!r.find(v => v.id === state.sel) && r.length) state.sel = r[0].id; state.view = 'detail'; renderList(); renderDetail(); document.querySelector('.item[aria-current="true"]')?.scrollIntoView({block:'nearest'}); }
  else { state.view = 'shop'; renderList(); }
  updateCmpBtn();
}
$('#viewBtn').addEventListener('click', () => setListMode(!listMode()));
$('#ssort').addEventListener('change', e => { state.sort = e.target.value; $('#sort').value = state.sort; renderList(); });
$('#sall').addEventListener('change', e => { state.onlyShop = !e.target.checked; renderList(); });
updateCmpBtn();
renderList();
</script>
<script>
(function(){var narrow=matchMedia('(max-width:820px)');
function jump(){if(narrow.matches&&document.body.classList.contains('listmode')){setTimeout(function(){var m=document.getElementById('listMain');if(m)m.scrollIntoView({behavior:'smooth',block:'start'});},60);}}
document.addEventListener('click',function(e){if(e.target.closest('.item, #cmpBtn'))jump();});})();
</script>
</body>
</html>
